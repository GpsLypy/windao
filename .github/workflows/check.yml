name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Validate unsigned MSIX with the Windows SDK
        shell: pwsh
        run: |
          cargo +stable build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw "Windows SDK MakeAppx.exe not found" }
          $env:PATH = "$($sdk.FullName)\x64;$env:PATH"
          ./build-msix.ps1 -Executable ./target/debug/windao.exe -Publisher "CN=Windows checks"
