[package]
name = "windao"
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"
description = "A Windows desktop capsule for daily tasks and media"
repository = "https://github.com/GpsLypy/windao"

[dependencies]
base64 = "0.22"
imap = { version = "2.4", default-features = false }
native-tls = "0.2"
mailparse = "0.19"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
raw-window-handle = "0.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
scraper = { version = "0.29.0", default-features = false }

[build-dependencies]
find-msvc-tools = "0.1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "29", default-features = false, features = ["dx12"] }
aes-gcm = "0.10"
arboard = { version = "3.7", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "UI_Notifications_Management",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
windows-collections = "0.3.2"
windows-future = "0.3.2"
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
