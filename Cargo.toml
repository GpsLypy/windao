[package]
name = "windao"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"
description = "A Windows desktop capsule for daily tasks and media"
repository = "https://github.com/GpsLypy/windao"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
raw-window-handle = "0.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
find-msvc-tools = "0.1"

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
arboard = { version = "3.7", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
windows-collections = "0.3.2"
windows-future = "0.3.2"
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
